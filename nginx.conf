worker_processes auto;
events { worker_connections 1024; }

http {
    log_format main '$remote_addr - $host [$time_local] "$request" '
                    '$status $body_bytes_sent sni="$ssl_server_name"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log notice;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # все пять имён из SAN листа — отдаёт один и тот же бэкенд
    server {
        listen 443 ssl;
        http2 off;
        server_name vc.go.mail.ru s1-vc.go.mail.ru vc1.go.mail.ru
                    voice-test2.ngx.openstack.go.devmail.ru vc1.go.devmail.ru;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/leaf.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://emulator:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }

    # на 80-м — ранний /generate_204 (Android/colonka-пробы) и редирект
    server {
        listen 80;
        server_name _;
        location = /generate_204 { return 204; }
        location / { return 301 https://$host$request_uri; }
    }
}
